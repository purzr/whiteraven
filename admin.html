<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پنل مدیریت</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 30px;
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .login-box {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,.1);
    }

    h1 {
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .login-btn {
      width: 100%;
      background: #222;
      color: white;
    }

    .logout-btn {
      background: #d9534f;
      color: white;
      margin-bottom: 20px;
    }

    .error {
      color: #d9534f;
      margin-top: 10px;
    }

    .message {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .message p {
      margin: 8px 0;
    }

    .date {
      color: #777;
      font-size: 13px;
    }

    #adminPanel {
      display: none;
    }
  </style>
</head>

<body>

  <!-- صفحه ورود -->
  <div id="loginBox" class="login-box">
    <h1>🔐 ورود مدیریت</h1>

    <label>ایمیل</label>
    <input
      type="email"
      id="email"
      placeholder="ایمیل مدیر"
    >

    <label>رمز عبور</label>
    <input
      type="password"
      id="password"
      placeholder="رمز عبور"
    >

    <button class="login-btn" onclick="login()">
      ورود
    </button>

    <div id="loginError" class="error"></div>
  </div>


  <!-- پنل مدیریت -->
  <div id="adminPanel" class="container">

    <h1>📩 پیام‌های دریافتی</h1>

    <button class="logout-btn" onclick="logout()">
      خروج از پنل
    </button>

    <div id="messages">
      در حال دریافت پیام‌ها...
    </div>

  </div>


  <script>

    const SUPABASE_URL =
      'https://zcnfhjjzhfqvhbmkiqnh.supabase.co';

    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjbmZoamp6aGZxdmhibWtpcW5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDY0MjMsImV4cCI6MjEwMTY4MjQyM30.jHwlq7o5kM0thdhLgdXQW3YJ6jAnq2qOrPvPyHhq2lQ';


    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    // ورود مدیر
    async function login() {

      const email =
        document.getElementById('email').value.trim();

      const password =
        document.getElementById('password').value;

      const errorBox =
        document.getElementById('loginError');

      errorBox.textContent = '';


      if (!email || !password) {
        errorBox.textContent =
          'ایمیل و رمز عبور را وارد کنید.';
        return;
      }


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        console.error(error);

        errorBox.textContent =
          'ایمیل یا رمز عبور اشتباه است.';

        return;
      }


      showAdminPanel();
    }


    // نمایش پنل
    function showAdminPanel() {

      document.getElementById('loginBox').style.display =
        'none';

      document.getElementById('adminPanel').style.display =
        'block';

      loadMessages();
    }


    // دریافت پیام‌ها
    async function loadMessages() {

      const { data, error } =
        await supabaseClient
          .from('messages')
          .select('*')
          .order('created_at', {
            ascending: false
          });


      console.log('DATA:', data);
      console.log('ERROR:', error);


      if (error) {

        document.getElementById('messages').innerHTML =
          '<p>خطا در دریافت پیام‌ها: ' +
          error.message +
          '</p>';

        return;
      }


      if (!data || data.length === 0) {

        document.getElementById('messages').innerHTML =
          '<p>هنوز پیامی دریافت نشده است.</p>';

        return;
      }


      document.getElementById('messages').innerHTML =
        data.map(msg => `

          <div class="message">
                   ${!msg.is_read ? '<span style="color:#d9534f;font-size:12px;">● جدید</span>' : ''}
            <p>
              <strong>نام:</strong>
              ${msg.name}
            </p>

            <p>
              <strong>ایمیل:</strong>
              ${msg.email}
            </p>

            <p>
              <strong>موضوع:</strong>
              ${msg.subject || '-'}
            </p>

            <p>
              <strong>پیام:</strong>
              ${msg.message}
            </p>

            <p class="date">
              <strong>تاریخ:</strong>
              ${new Date(msg.created_at)
                .toLocaleString('fa-IR')}
            </p>
            <button
              onclick="deleteMessage('${msg.id}')"
              style="background:#d9534f;color:white;margin-top:10px;"
              >
              حذف پیام
              </button>

          </div>

        `).join('');
const unreadIds = data
  .filter(msg => !msg.is_read)
  .map(msg => msg.id);

if (unreadIds.length > 0) {
  await supabaseClient
    .from('messages')
    .update({ is_read: true })
   .in('id', unreadIds);
  }
}

async function deleteMessage(id) {
  const confirmDelete = confirm('آیا از حذف این پیام مطمئن هستید؟');

  if (!confirmDelete) return;

  const { error } = await supabaseClient
    .from('messages')
    .delete()
    .eq('id', id);

  if (error) {
    console.error('DELETE ERROR:', error);
    alert('حذف پیام انجام نشد');
    return;
  }

  alert('پیام با موفقیت حذف شد ✓');
  loadMessages();
}
    // خروج
    async function logout() {

      await supabaseClient.auth.signOut();

      document.getElementById('adminPanel').style.display =
        'none';

      document.getElementById('loginBox').style.display =
        'block';

      document.getElementById('password').value = '';

    }


    // بررسی اینکه قبلاً وارد شده‌ای یا نه
    async function checkUser() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();


      if (session) {
        showAdminPanel();
      }

    }


    checkUser();

  </script>

</body>
</html>
