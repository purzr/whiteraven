<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>در حال انتقال...</title>
<script>
(function(){
  var l = window.location;
  // اگر همین الان روی یک لینک ری‌دایرکت‌شده هستیم (یعنی already has ?/...),
  // دوباره ری‌دایرکت نکن تا لوپ نشود.
  if (l.search[1] === '/') { return; }

  var path = l.pathname + l.search.replace('?','&') + l.hash;
  path = path.replace(/&/g, '~and~');

  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    '/?/' + path.slice(1)
  );
})();
</script>
</head>
<body>
  <p>در حال انتقال به صفحه...</p>
</body>
</html>
