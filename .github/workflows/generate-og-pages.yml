name: Generate product OG pages

on:
  push:
    branches: [main]
  schedule:
    # هر ۶ ساعت یه‌بار اجرا می‌شه تا محصولات جدید/تغییریافته هم پوشش داده بشن
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate product pages
        run: node scripts/generate-product-pages.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add product
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: regenerate product OG pages"
            git push
          fi
